<style>
:root{
  --vh:1vh;
  --pw:min(48vw, calc(var(--vh) * 74 * 0.5628));
  --ph:calc(var(--pw) / 0.5628);
  --red:#8e1a2b;
  --cream:#fff6e6;
  --ink:#5a3b22;
  --hand:"Bradley Hand","Segoe Print","Marker Felt","Comic Sans MS","Chalkboard SE",cursive;
}
@supports (height:1dvh){ :root{ --vh:1dvh; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#c8a47a}
body{
  font-family:var(--hand);color:var(--ink);
  background-color:#c9a174;
  background-image:
    radial-gradient(ellipse at 50% 45%, rgba(255,235,200,.35), rgba(80,45,15,.38) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .2  0 0 0 0 .08  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  user-select:none;-webkit-user-select:none;
}

/* ---------- scrapbook decor ---------- */
.decor{position:fixed;pointer-events:none;z-index:0}
.gingham{
  background-color:#fdf1dc;
  background-image:
    linear-gradient(rgba(190,28,45,.6) 50%,transparent 50%),
    linear-gradient(90deg,rgba(190,28,45,.6) 50%,transparent 50%);
  background-size:26px 26px;
  filter:drop-shadow(0 4px 6px rgba(60,30,10,.35));
}
.g1{top:-2vmin;right:-2vmin;width:46vmin;height:34vmin;clip-path:polygon(34% 0,100% 0,100% 100%,84% 80%,66% 72%,52% 46%,40% 22%);}
.g2{bottom:-2vmin;left:-2vmin;width:44vmin;height:32vmin;clip-path:polygon(0 0,18% 24%,40% 34%,54% 62%,76% 78%,100% 100%,0 100%);}
.pin{top:calc(3vmin + 1px);right:6vmin;width:5.2vmin;height:5.2vmin;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff8a8a,#d21f2f 55%,#8a0f1c);box-shadow:.8vmin 1.2vmin 1.2vmin rgba(60,20,10,.45)}
.sticker{font-size:clamp(20px,5vmin,44px);opacity:.8;transform:rotate(var(--r,0deg));filter:drop-shadow(0 2px 2px rgba(60,30,10,.3))}

/* ---------- book ---------- */
.scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
.book{
  position:relative;z-index:1;width:calc(var(--pw)*2);height:var(--ph);
  perspective:2400px;
  transform:translateX(calc(var(--pw) * -0.5));
  transition:transform 1.1s cubic-bezier(.55,.06,.2,1);
}
.book.open{transform:none}
.page{position:absolute;z-index:1;top:0;width:var(--pw);height:var(--ph);overflow:hidden;background-size:100% 100%;background-repeat:no-repeat;
  box-shadow:0 14px 30px rgba(50,25,5,.38),0 2px 4px rgba(50,25,5,.3)}

  box-shadow:0 1px 3px rgba(60,30,10,.25);pointer-events:none;z-index:40}
.tape.t1{top:calc(var(--pw)*-.03);left:calc(50% + var(--pw)*.5 - var(--pw)*.2);transform:rotate(32deg)}

.hint{position:absolute;left:var(--pw);width:var(--pw);top:calc(var(--ph) + 18px);text-align:center;font-size:clamp(14px,3.6vw,20px);
  transition:opacity .4s;pointer-events:none}
.hint span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.book.open .hint{opacity:0}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- left page: letter ---------- */
.peek{position:absolute;inset:0;border:0;background:transparent;padding:0;cursor:pointer;z-index:3;
  clip-path:polygon(5.98% 22.32%, 39.40% 38.23%, 39.40% 63.61%, 5.98% 79.82%)}
.peek:focus-visible{outline:none;background:rgba(255,255,255,.18)}
.tap-label{position:absolute;left:50%;top:88.5%;transform:translateX(-50%) rotate(-3deg);background:var(--cream);color:var(--red);
  padding:.25em .8em;border-radius:6px;font-size:clamp(11px,2.7vw,17px);white-space:nowrap;box-shadow:0 2px 5px rgba(50,25,5,.35);z-index:4;pointer-events:none;
  animation:wiggle 2.2s ease-in-out infinite}
.tap-label.hide{display:none}
@keyframes wiggle{50%{transform:translateX(-50%) rotate(2deg) translateY(-2px)}}

.scrim{position:fixed;inset:0;background:rgba(40,20,5,.28);opacity:0;pointer-events:none;transition:opacity .5s;z-index:0}
.scrim.on{opacity:1;pointer-events:auto}
.letter{
  position:absolute;z-index:60;
  left:calc(var(--pw)*0.05978);top:calc(var(--ph)*0.14373);width:calc(var(--pw)*0.71168);
  opacity:0;pointer-events:none;cursor:pointer;
  filter:drop-shadow(0 0 0 rgba(40,15,0,0));
  transition:left .85s cubic-bezier(.3,.9,.3,1),top .85s cubic-bezier(.3,.9,.3,1),width .85s cubic-bezier(.3,.9,.3,1),
             transform .85s cubic-bezier(.3,.9,.3,1),filter .85s,opacity .18s;
}
.letter .paper{display:block;width:100%;clip-path:polygon(0.00% 11.17%, 46.96% 33.51%, 46.96% 69.16%, 0.00% 91.92%);transition:clip-path .85s cubic-bezier(.3,.9,.3,1)}
.letter img{display:block;width:100%;height:auto;pointer-events:none}
.letter.show{opacity:1;pointer-events:auto}
.letter.lifted{left:var(--lx);top:var(--ly);width:var(--lw);transform:rotate(-1.4deg);
  filter:drop-shadow(0 14px 16px rgba(40,15,0,.4))}
.letter.lifted .paper{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}

/* ---------- right page: candles ---------- */
.flame{position:absolute;transform-origin:50% 94%;will-change:transform;z-index:3;pointer-events:none}
.flame .fi{position:relative;width:100%;height:100%;transform-origin:50% 94%;
  animation:flick var(--d,1.3s) ease-in-out infinite alternate;transition:transform .3s ease-in,opacity .3s}
.flame img{display:block;width:100%;height:100%;position:relative}
.flame .glow{position:absolute;left:50%;top:48%;width:360%;height:260%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,90,.5),rgba(255,170,40,.16) 45%,rgba(255,170,40,0) 70%);animation:glow 1.1s ease-in-out infinite alternate;pointer-events:none}
@keyframes flick{0%{transform:rotate(-1.8deg) scale(1,.97)}50%{transform:rotate(1.2deg) scale(.98,1.03)}100%{transform:rotate(-.6deg) scale(1.01,.99)}}
@keyframes glow{from{opacity:.75}to{opacity:1}}
.flame.out .fi{animation:none;transform:scale(.15,.05) translateY(10%);opacity:0}
.flame.ignite .fi{animation:ignite .5s ease-out, flick var(--d,1.3s) .5s ease-in-out infinite alternate}
@keyframes ignite{from{transform:scale(.1);opacity:0}60%{transform:scale(1.25,1.3);opacity:1}to{transform:scale(1)}}
.smoke{position:absolute;z-index:3;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(255,250,240,.75),rgba(255,250,240,0) 70%);animation:smoke 1.5s ease-out forwards}
@keyframes smoke{from{transform:translate(0,0) scale(.5);opacity:.9}to{transform:translate(calc(var(--sx,10px)),-60px) scale(2.2);opacity:0}}

.hud{position:absolute;z-index:6;left:11%;right:11%;top:17%;text-align:center;transform:rotate(-1.5deg)}
.hud .tag{background:rgba(255,246,230,.94);border-radius:8px;padding:.5em .7em .45em;box-shadow:0 3px 8px rgba(50,25,5,.35);position:relative}
.hud .tag::before{content:"";position:absolute;left:50%;top:-9px;width:34%;height:16px;transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(135deg,rgba(255,200,215,.85) 0 6px,rgba(255,235,240,.85) 6px 12px)}
.meter{position:relative;height:calc(var(--pw)*.045);min-height:9px;border:2px solid var(--ink);border-radius:99px;background:#f2e2c8;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#f7b6c8,#e8506a)}
.meter b{position:absolute;top:0;bottom:0;left:40%;width:2px;background:rgba(90,59,34,.55)}
.mstat{margin-top:.35em;font-size:clamp(10px,2.4vw,14px);line-height:1.15;background:none;border:0;padding:0;font-family:inherit;color:var(--ink);cursor:default}
.mstat.click{cursor:pointer;text-decoration:underline dotted}
.hud.hidden{display:none}

.wish{position:absolute;z-index:7;left:6%;right:6%;top:15%;text-align:center;display:none;transform:rotate(-2deg)}
.wish.show{display:block;animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.wish .tag{background:var(--cream);border-radius:10px;padding:.6em .6em .7em;box-shadow:0 4px 10px rgba(50,25,5,.4);position:relative}
.wish .tag::before{content:"";position:absolute;left:50%;top:-10px;width:36%;height:18px;transform:translateX(-50%) rotate(2deg);
  background:repeating-linear-gradient(135deg,rgba(255,200,215,.85) 0 6px,rgba(255,235,240,.85) 6px 12px)}
.wish h2{margin:0;font-weight:700;font-size:calc(var(--pw)*.09);line-height:1.15;color:var(--red)}
.wish p{margin:.2em 0 .5em;font-size:calc(var(--pw)*.052)}
@keyframes pop{from{transform:rotate(-2deg) scale(.3);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}

.btn{font-family:var(--hand);font-size:clamp(12px,3.2vw,17px);color:var(--red);background:var(--cream);border:2px solid var(--red);border-radius:99px;
  padding:.45em 1em;cursor:pointer;box-shadow:0 3px 0 rgba(90,50,20,.4);touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;white-space:nowrap}
.btn:active,.btn.down{transform:translateY(3px);box-shadow:0 0 0 rgba(90,50,20,.4)}
.btn:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.btn.small{font-size:clamp(11px,2.8vw,15px);padding:.3em .9em}
#hold{touch-action:none}

.dock{position:absolute;left:0;right:0;top:calc(var(--ph) + 16px);display:flex;justify-content:space-between;align-items:center;gap:8px;
  opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}
.book.open .dock{opacity:1;pointer-events:auto;transition-delay:.8s}
.book.open.reading .dock{opacity:0;pointer-events:none;transition-delay:0s}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (prefers-reduced-motion:reduce){
  .book,.leaf{transition-duration:.01s}
  .tap-label,.hint span{animation:none}
}
</style>
</head>

<script>
(function(){
'use strict';
var RECIPIENT = 'sayang';            // <- change the name in "make a wish, ..."
var BLOW_SECONDS = 0.5;              // how long you need to blow
var BLOW_LEVEL = 40/100;        // meter level counted as "blowing"
var BEND_MAX = 40;                   // degrees the flames lean at full blow

var $ = function(id){return document.getElementById(id)};
var book=$('book'), leaf=$('leaf'), letter=$('letter'), peek=$('peek'), tapLabel=$('tapLabel'), scrim=$('scrim');
var meterFill=$('meterFill'), mstat=$('mstat'), hud=$('hud'), wish=$('wish'), pgRight=$('pgRight');
var flames=[].slice.call(document.querySelectorAll('.flame'));
$('wishText').textContent='make a wish, '+RECIPIENT;

var isOpen=false, busy=false, lifted=false, lit=true, everLifted=false;

/* ================= open / close ================= */
function openBook(){
  if(busy||isOpen) return;
  busy=true; prepAudio();
  book.classList.add('open');
  setTimeout(function(){
    leaf.classList.add('gone'); isOpen=true; busy=false;
    enableMic(); lastT=0; requestAnimationFrame(loop);
  },1150);
}
function closeBook(){
  if(busy||!isOpen) return;
  busy=true;
  var wait = lifted ? 800 : 0;
  if(lifted) tuck();
  setTimeout(function(){
    stopMic(); isOpen=false;
    leaf.classList.remove('gone'); void leaf.offsetWidth;
    requestAnimationFrame(function(){
      book.classList.remove('open');
      stopConfetti();
      relight(true);
      setTimeout(function(){busy=false},1150);
    });
  },wait);
}
leaf.addEventListener('click',openBook);
leaf.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&!isOpen){e.preventDefault();openBook();} });
$('back').addEventListener('click',closeBook);

/* ================= letter ================= */
function placeLift(){
  var r=book.getBoundingClientRect(), pw=r.width/2, ph=r.height;
  var lw=pw*0.84, lx=pw*0.08, ly=ph*0.08;
  if(pw<250){                         // phones: let the letter use the screen so it is readable
    lw=Math.min(innerWidth*0.92, innerHeight*0.84*0.5625);
    var lh=lw*1920/1080;
    lx=(innerWidth/2-r.left)-lw/2; ly=(innerHeight/2-r.top)-lh/2;
  }
  letter.style.setProperty('--lw',lw+'px');
  letter.style.setProperty('--lx',lx+'px');
  letter.style.setProperty('--ly',ly+'px');
}
var letterTimer=0;
function lift(){
  if(lifted||!isOpen) return;
  lifted=true; clearTimeout(letterTimer);
  placeLift();
  letter.classList.add('show'); if(book.getBoundingClientRect().width/2<250) book.classList.add('reading');   // phones: letter covers the dock
  void letter.offsetWidth;
  requestAnimationFrame(function(){ letter.classList.add('lifted'); scrim.classList.add('on'); });
  peek.style.pointerEvents='none';
  tapLabel.classList.add('hide'); everLifted=true;
}
function tuck(){
  if(!lifted) return;
  lifted=false;
  letter.classList.remove('lifted'); scrim.classList.remove('on'); book.classList.remove('reading');
  letterTimer=setTimeout(function(){
    letter.classList.remove('show'); peek.style.pointerEvents='';
  },880);
}
peek.addEventListener('click',lift);
letter.addEventListener('click',function(){ lifted?tuck():lift(); });
scrim.addEventListener('click',tuck);
addEventListener('resize',function(){ if(lifted) placeLift(); });

/* ================= audio / mic ================= */
var actx=null, analyser=null, stream=null, tbuf=null;
var mic={state:'off'};            // off | asking | on | denied | nohttps | error
var floor=0.004, micLevel=0;

function prepAudio(){
  try{
    if(!actx){ var AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); }
    if(actx&&actx.state==='suspended') actx.resume();
  }catch(e){}
}
function setStat(){
  var t={off:'mic: tap to enable',asking:'allow the mic…',on:'blow into the mic ♡',denied:'mic blocked – use the button below',
         nohttps:'mic needs https – use the button below',error:'no mic – use the button below'}[mic.state];
  mstat.textContent=t;
  var clickable=(mic.state==='off'||mic.state==='denied'||mic.state==='error');
  mstat.classList.toggle('click',clickable);
}
function enableMic(){
  if(mic.state==='on'||mic.state==='asking') return;
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ mic.state='nohttps'; setStat(); return; }
  prepAudio(); if(!actx){ mic.state='error'; setStat(); return; }
  mic.state='asking'; setStat();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
  .then(function(s){
    if(!isOpen){ s.getTracks().forEach(function(t){t.stop()}); mic.state='off'; return; }
    stream=s;
    var src=actx.createMediaStreamSource(s);
    analyser=actx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0;
    src.connect(analyser);                       // not connected to speakers -> no feedback
    tbuf=new Float32Array(analyser.fftSize);
    floor=0.004; mic.state='on'; setStat();
  })
  .catch(function(e){ mic.state=(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))?'denied':'error'; setStat(); });
}
function stopMic(){
  if(stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null; }
  analyser=null; mic.state='off'; micLevel=0; setStat();
}
mstat.addEventListener('click',function(){ if(mic.state==='off'||mic.state==='denied'||mic.state==='error') enableMic(); });
setStat();

function readMic(dt){
  if(mic.state!=='on'||!analyser) return 0;
  analyser.getFloatTimeDomainData(tbuf);
  var s=0; for(var i=0;i<tbuf.length;i++) s+=tbuf[i]*tbuf[i];
  var rms=Math.sqrt(s/tbuf.length);
  // adaptive noise floor: follows quiet room noise, barely moves during a loud blow
  if(rms<floor*2+0.004) floor+=(rms-floor)*0.03; else floor+=(rms-floor)*0.0015;
  var raw=Math.max(0,rms-floor*1.5-0.008)/0.14;
  return Math.min(1,raw);
}

/* ================= hold-to-blow fallback ================= */
var holding=false, holdLevel=0;
var holdBtn=$('hold');
function setHold(v){ holding=v; holdBtn.classList.toggle('down',v); }
holdBtn.addEventListener('pointerdown',function(e){ e.preventDefault(); try{holdBtn.setPointerCapture(e.pointerId)}catch(_){} setHold(true); });
['pointerup','pointercancel','lostpointercapture'].forEach(function(n){ holdBtn.addEventListener(n,function(){ setHold(false); }); });
holdBtn.addEventListener('contextmenu',function(e){e.preventDefault()});
addEventListener('keydown',function(e){
  if((e.code==='Space'||e.key===' ')&&isOpen){ e.preventDefault(); setHold(true); }
});
addEventListener('keyup',function(e){
  if((e.code==='Space'||e.key===' ')&&isOpen){ e.preventDefault(); setHold(false); }
});
addEventListener('blur',function(){ setHold(false); });

/* ================= main loop: meter, bend, blow-out ================= */
var lastT=0, lvl=0, blowT=0, bend=[0,0,0];
function loop(t){
  if(!isOpen) return;
  var dt=lastT?Math.min(0.05,(t-lastT)/1000):0.016; lastT=t;

  var m=readMic(dt);
  var target=holding?0.88+0.1*Math.sin(t/55):0;
  holdLevel+= (target-holdLevel)*Math.min(1,dt*14);
  var raw=Math.max(m,holdLevel);
  lvl = raw>lvl ? raw : Math.max(raw,lvl-dt*3);        // quick attack, gentle fall
  meterFill.style.width=(lvl*100).toFixed(1)+'%';

  if(lit){
    for(var i=0;i<flames.length;i++){
      var want=lvl*BEND_MAX*(0.85+0.15*i);
      bend[i]+=(want-bend[i])*Math.min(1,dt*10);
      var b=bend[i], sq=1-Math.min(.25,lvl*.22), sk=-b*0.35;
      flames[i].style.transform='rotate('+b.toFixed(1)+'deg) skewX('+sk.toFixed(1)+'deg) scale('+(1-lvl*.1).toFixed(3)+','+sq.toFixed(3)+')';
    }
    if(lvl>BLOW_LEVEL) blowT+=dt; else blowT=Math.max(0,blowT-dt*1.5);
    if(blowT>=BLOW_SECONDS) blowOut();
  }
  requestAnimationFrame(loop);
}

/* ================= blow out / relight ================= */
function blowOut(){
  lit=false; blowT=0;
  flames.forEach(function(f,i){
    setTimeout(function(){
      f.classList.remove('ignite'); f.classList.add('out');
      puff(f);
    },i*110);
  });
  setTimeout(function(){
    hud.classList.add('hidden'); wish.classList.add('show'); burst();
  },420);
}
function puff(f){
  var s=document.createElement('div'); s.className='smoke';
  s.style.left=f.style.left; s.style.top=f.style.top; s.style.width=f.style.width; s.style.height=f.style.width;
  s.style.setProperty('--sx',(8+Math.random()*14)+'px');
  pgRight.appendChild(s); setTimeout(function(){ s.remove() },1600);
}
function relight(silent){
  lit=true; blowT=0; lvl=0;
  wish.classList.remove('show'); hud.classList.remove('hidden');
  flames.forEach(function(f,i){
    f.classList.remove('out'); f.style.transform='';
    bend[i]=0;
    if(!silent){ f.classList.remove('ignite'); void f.offsetWidth; f.classList.add('ignite'); }
  });
}
$('relight').addEventListener('click',function(){ stopConfetti(); relight(false); });

/* ================= confetti ================= */
var cv=$('confetti'), cx=cv.getContext('2d'), parts=[], raf=0, rainUntil=0;
var COLORS=['#e63e5c','#f7a8c0','#ffd23f','#7fa3e6','#fff4e0','#b3202f','#8bd3a8'];
function fit(){ var d=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*d; cv.height=innerHeight*d; cx.setTransform(d,0,0,d,0,0); }
addEventListener('resize',fit); fit();
function spawn(x,y,vx,vy){
  parts.push({x:x,y:y,vx:vx,vy:vy,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,
    c:COLORS[(Math.random()*COLORS.length)|0],round:Math.random()<.25,life:0,max:3.2+Math.random()*1.8});
}
function burst(){
  var r=pgRight.getBoundingClientRect(), ox=r.left+r.width/2, oy=r.top+r.height*0.45;
  for(var i=0;i<150;i++){
    var a=-Math.PI/2+(Math.random()-.5)*2.4, v=5+Math.random()*10;
    spawn(ox,oy,Math.cos(a)*v,Math.sin(a)*v);
  }
  rainUntil=performance.now()+1500;
  if(!raf){ lastC=0; raf=requestAnimationFrame(tickC); }
}
var lastC=0;
function tickC(t){
  var dt=lastC?Math.min(.05,(t-lastC)/1000):.016; lastC=t;
  if(t<rainUntil && Math.random()<.9){ for(var k=0;k<3;k++) spawn(Math.random()*innerWidth,-10,(Math.random()-.5)*2,2+Math.random()*3); }
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.life+=dt;
    p.vy+=14*dt; p.vx*=Math.pow(.2,dt); p.vy*=Math.pow(.45,dt); p.vy+=6*dt;
    p.x+=p.vx*60*dt; p.y+=p.vy*60*dt*0.6; p.r+=p.vr;
    if(p.life>p.max||p.y>innerHeight+20){ parts.splice(i,1); continue; }
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=Math.min(1,(p.max-p.life)*1.5);
    cx.fillStyle=p.c;
    if(p.round){ cx.beginPath(); cx.arc(0,0,p.h/1.6,0,6.28); cx.fill(); } else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  }
  if(parts.length||t<rainUntil) raf=requestAnimationFrame(tickC); else { raf=0; cx.clearRect(0,0,innerWidth,innerHeight); }
}
function stopConfetti(){ parts.length=0; rainUntil=0; if(raf){ cancelAnimationFrame(raf); raf=0; } cx.clearRect(0,0,innerWidth,innerHeight); }

/* test hooks (harmless) */
window.__card={blowOut:blowOut,state:function(){return {isOpen:isOpen,lifted:lifted,lit:lit,mic:mic.state,lvl:lvl,blowT:blowT}}};
})();
